<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca de Jogos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@6..12,500;6..12,600;6..12,700;6..12,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  {% if request.state.user %}
  <nav class="topbar">
    <a class="topbar__brand" href="/">Biblioteca de Jogos</a>
    <div class="topbar__links">
      <a class="topbar__link" href="/configuracoes">Configurações</a>
      <form class="topbar__logout" method="post" action="/logout">
        <button type="submit" class="topbar__link topbar__link--button">Sair</button>
      </form>
    </div>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}

  <dialog id="game-modal" class="game-modal">
    <button type="button" class="game-modal__close" aria-label="Fechar" data-modal-close>&times;</button>
    <div id="game-modal-content" class="game-modal__content"></div>
  </dialog>

  <template id="game-modal-skeleton">
    <div class="game-modal__layout" aria-busy="true" aria-live="polite">
      <div class="game-modal__pocket">
        <span class="skeleton-block game-modal__skeleton-cover"></span>
      </div>
      <div class="game-modal__sheet">
        <span class="skeleton-block game-modal__skeleton-title"></span>
        <span class="skeleton-block game-modal__skeleton-meta"></span>
        <span class="skeleton-block game-modal__skeleton-scores"></span>
        <span class="skeleton-block game-modal__skeleton-line"></span>
        <span class="skeleton-block game-modal__skeleton-line"></span>
        <span class="skeleton-block game-modal__skeleton-line game-modal__skeleton-line--short"></span>
        <div class="game-modal__skeleton-gallery">
          <span class="skeleton-block"></span>
        </div>
      </div>
    </div>
  </template>

  <script src="/static/game-modal.js" defer></script>
</body>
</html>
