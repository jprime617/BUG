<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca de Jogos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  {% block content %}{% endblock %}

  <dialog id="game-modal" class="game-modal">
    <button type="button" class="game-modal__close" aria-label="Fechar" data-modal-close>&times;</button>
    <div id="game-modal-content" class="game-modal__content">
      <p class="modal-loading">Carregando…</p>
    </div>
  </dialog>

  <script src="/static/game-modal.js" defer></script>
</body>
</html>
